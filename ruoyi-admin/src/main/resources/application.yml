# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.5
  # 版权年份
  copyrightYear: 2023
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关720
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: char

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8086
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn
    org.apache.ibatis: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  10MB
       # 设置总上传的文件大小
       max-request-size:  20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: 123456
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥
    secret: abcdefghijklmnopqrstuvwxyz
    # 令牌有效期（默认30分钟）
    expireTime: 720

# MyBatis配置
mybatis:
    # 搜索指定包别名
    typeAliasesPackage: com.ruoyi.**.domain
    # 配置mapper的扫描，找到所有的mapper.xml映射文件
    mapperLocations: classpath*:mapper/**/*Mapper.xml
    # 加载全局的配置文件
    configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: oracle
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

push:
    appId: JoJqnwdZlv7wWqD3son3Q1
    appKey: YmNmPyWE008vzVbWgcXOk4
    masterSecret: 1OxiprkbnIA27fnioo6Rk5
    AppSecret: vmLSoh7ZNq57x4K5FnW3G4

# edoc2 电子文档系统对接配置（生产环境）
# 详见 edoc常用接口文档.txt；账号由开放平台统一分配，认证含 IP 白名单
edoc:
    # 是否启用
    enabled: true
    # 业务接口网关（/api/services/* 的统一前缀）
    #gateway-url: https://openapi.goldwind.com:26035/gateway/api-edoc/
    gateway-url: https://openapi.goldwind.com/gateway/api-edoc/

  # 集成登录获取 token 的地址（api-eis 网关）
    #token-url: https://openapi.goldwind.com:26035/gateway/api-eis/portal/rest/getEdocToken
    token-url: https://openapi.goldwind.com/gateway/api-eis/portal/rest/getEdocToken

  # edoc2 ECM 站点地址（下载 SDK 使用；上传两步实际走下面的 webcore-url 网关）
    #ecm-url: https://edoc.goldwind.com:26036
    ecm-url: https://edoc.goldwind.com

  # WebCore/document 上传地址前缀。实测 /WebCore 与 /document/upload 均挂在 api-edoc 网关下可达，
    # 直连 ECM 站点 edoc.goldwind.com 不通，故指向网关（勿留空回退 ecm-url）
    #webcore-url: https://openapi.goldwind.com:26035/gateway/api-edoc
    webcore-url: https://openapi.goldwind.com/gateway/api-edoc

  # 文件下载接口路径（挂在 ecm-url 下，需 ECM 站点可达；网关无此路由）
    download-path: /document/download
    # BASIC 认证账号（开放平台应用凭证，网关应用级订阅授权）。
    # U96176 作为应用的网关订阅授权尚未开通（curl 实测 941「You do not have permission」），
    # 故 BASIC 暂用已授权的应用 dkwms 过网关（2026-09-08 上传/下载实测通过的组合）；
    # 取 token 的 edoc2 用户仍为 U96176（见下方 user-id，dkwms 是应用账号、非 edoc2 用户）。
    # 待平台给 U96176 应用开通 getEdocToken / WebCore / document/upload 订阅后，可把这两项切回 U96176。
    auth-username: dkwms
    auth-password: ybkI)3866S9x3tF2R3DedrFT

    #auth-username: U96176
    #auth-password: edoc-wms/KIu6kfz@

    # 获取 token 的用户标识（edoc2 用户编号，内部做 MD5）。必须为 edoc2 用户 U96176，不能用应用账号 dkwms
    user-id: "U96176"
    # 默认上传文件夹 ID（企业内容库>金风>制造中心>仓储管理>电控WMS系统存储文档；显式指定，
    # 避免调用网关未授权的 Folder 查找/创建接口）
    default-folder-id: 1956664
    # 默认上传文件夹名称（仅当 default-folder-id<=0 时使用）
    default-folder-name: WMS配送核验单
    # 超时（毫秒）
    connect-timeout: 10000
    read-timeout: 120000
    # 本地文件目录（edoc 下载文件 + 签字后 PDF 归档；生产/开发均为 D 盘，D 盘根目录下自动创建）
    temp-dir: D:/edoc-download
    # 本地文件保留天数（可配置），按文件「创建时间」超过该天数即删除（每天凌晨 3:17 清理）。
    # 以 edoc 永久存储为准，本地仅暂存；当前设 15 天
    temp-retention-days: 15
